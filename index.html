<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candle Focus Timer · Flutter</title>
  <meta name="description" content="Candle focus timer in Flutter: a candle that lights itself and melts while you focus, with rolling digits and smoke when the session ends. Live in a phone frame.">
  <link rel="icon" type="image/png" href="app/favicon.png">
  <style>
    :root {
      /* Always dark, whatever the viewer's system theme. */
      color-scheme: dark;
      --bg: #110b09;
      --bg-2: #3a1d0c;
      --text: #f5ece5;
      --muted: #9a8f88;
      --accent: #f4b37a;
      --frame: #0b0807;
      --frame-edge: #4a3d35;
      --app: #0f0a09;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(circle at 50% 35%, var(--bg-2), var(--bg) 62%);
      color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Phone is laid out at real iPhone size, then scaled to fit the window. */
    .stage { width: 417px; height: 876px; flex: none; transform-origin: center; }
    .phone {
      position: relative;
      width: 417px;
      height: 876px;
      padding: 12px;
      border-radius: 64px;
      background: var(--frame);
      box-shadow:
        0 0 0 2px var(--frame-edge),
        0 40px 90px rgba(0, 0, 0, 0.5),
        0 0 120px rgba(240, 140, 60, 0.18);
    }
    /* Side buttons. */
    .phone::before, .phone::after {
      content: "";
      position: absolute;
      width: 4px;
      background: var(--frame-edge);
      border-radius: 2px;
    }
    .phone::before { left: -5px; top: 170px; height: 100px; }
    .phone::after { right: -5px; top: 220px; height: 120px; }

    .screen {
      position: relative;
      width: 393px;
      height: 852px;
      border-radius: 52px;
      overflow: hidden;
      background: var(--app);
    }
    /* The app fills the whole screen; status bar and home indicator sit on top, like on an iPhone. */
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .status {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 50px;
      padding: 18px 32px 0 44px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font: 600 16px/1 -apple-system, system-ui, sans-serif;
      color: var(--text);
      pointer-events: none;
      z-index: 2;
    }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons svg { fill: currentColor; }
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      border-radius: 20px;
      background: #000;
      pointer-events: none;
      z-index: 3;
    }
    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 9px;
      transform: translateX(-50%);
      width: 136px;
      height: 5px;
      border-radius: 3px;
      background: var(--text);
      opacity: 0.85;
      pointer-events: none;
      z-index: 2;
    }

    .caption {
      flex: none;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .caption a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .caption a:hover { text-decoration: underline; }

    /* On a real phone, skip the frame and run the app full screen. */
    @media (max-width: 500px) {
      body { display: block; }
      .stage, .phone, .screen { width: 100%; height: 100%; transform: none !important; }
      .phone { padding: 0; border-radius: 0; box-shadow: none; background: var(--app); }
      .phone::before, .phone::after, .status, .island, .home-indicator, .caption { display: none; }
      .screen { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="screen">
        <iframe id="app" title="Candle focus timer app"></iframe>
        <div class="island"></div>
        <div class="status">
          <span id="clock">9:41</span>
          <span class="status-icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.6c-.6 0-1.1.2-1.5.6L8 11.6l1.5-1.6c-.4-.4-.9-.6-1.5-.6Z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" opacity="0.4"/></svg>
          </span>
        </div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
  <p class="caption">
    Built with Flutter · A 1-minute session for the demo ·
    <a href="https://yaqoobdeveloper.com/pro">Get the full source code</a>
  </p>

  <script>
    // In the phone frame the app gets iPhone-like safe areas; full screen on a real phone it doesn't.
    document.getElementById('app').src = window.innerWidth > 500 ? 'app/?frame=1' : 'app/';

    const stage = document.getElementById('stage');
    function fit() {
      if (window.innerWidth <= 500) { stage.style.transform = ''; stage.style.margin = ''; return; }
      const scale = Math.min(1, (window.innerHeight - 70) / 876, (window.innerWidth - 32) / 417);
      stage.style.transform = `scale(${scale})`;
      // Collapse the empty space a scaled-down element would otherwise leave.
      const gap = (876 * (1 - scale)) / 2;
      stage.style.margin = `${-gap}px 0`;
    }
    fit();
    window.addEventListener('resize', fit);

    const clock = document.getElementById('clock');
    function tick() {
      const d = new Date();
      clock.textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
    }
    tick();
    setInterval(tick, 30000);
  </script>
</body>
</html>
